<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="BeBoss Enterprise POS — Download the Android APK or scan QR, experience offline-first retail checkout & multi-device auto-sync, read 4-language documentation (EN, RW, FR, SW), or open Master Admin Console." />
  <title>BeBoss Enterprise POS — Download APK, Scan QR, Interactive Demo & Master Admin</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --surface: #0f172a;
      --card: #131d35;
      --card-2: #192542;
      --border: #253456;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --orange: #f97316;
      --orange-soft: rgba(249, 115, 22, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.14);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
    .hidden { display: none !important; }
    a { color: inherit; text-decoration: none; }

    /* Shared UI Primitives */
    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 6px 10px; font-size: 11.5px; border-radius: 8px; }
    .btn-lg { padding: 12px 18px; font-size: 13.5px; border-radius: 12px; }
    .btn-primary { background: var(--orange); color: #fff; box-shadow: 0 8px 22px rgba(249, 115, 22, 0.25); }
    .btn-primary:hover:not(:disabled) { background: #ea580c; transform: translateY(-1px); }
    .btn-green { background: var(--green); color: #042f2e; }
    .btn-green:hover:not(:disabled) { background: #059669; color: #fff; }
    .btn-red { background: var(--red-soft); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .btn-red:hover:not(:disabled) { background: var(--red); color: #fff; }
    .btn-dark { background: var(--card-2); border-color: var(--border); color: var(--ink); }
    .btn-dark:hover:not(:disabled) { border-color: #475569; background: #213154; }
    .btn-blue { background: var(--blue-soft); border-color: rgba(56, 189, 248, 0.4); color: #7dd3fc; }

    .input, .select, .textarea {
      width: 100%;
      background: #0a101f;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.16);
    }
    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .b-green { background: var(--green-soft); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .b-orange { background: var(--orange-soft); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.35); }
    .b-red { background: var(--red-soft); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .b-blue { background: var(--blue-soft); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .b-purple { background: var(--purple-soft); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, 0.35); }
    .b-amber { background: var(--amber-soft); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }

    /* Public Web App Layout */
    .pub-container {
      max-width: 1260px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .pub-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 11, 20, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(37, 52, 86, 0.85);
    }
    .pub-nav-inner {
      max-width: 1260px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .pub-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pub-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .pub-links a:hover { color: #fdba74; }
    .pub-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lang-switcher {
      display: inline-flex;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--orange);
      color: #fff;
    }

    .pub-hero {
      padding: 54px 0 46px;
      background:
        radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.16), transparent 44%),
        radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.13), transparent 40%),
        var(--bg);
      border-bottom: 1px solid rgba(37, 52, 86, 0.7);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.9fr;
      gap: 32px;
      align-items: center;
    }
    .hero-pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--orange-soft);
      border: 1px solid rgba(249, 115, 22, 0.35);
      color: #fdba74;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }
    .hero-h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: -0.025em;
    }
    .hero-p {
      margin: 14px 0 22px;
      color: #cbd5e1;
      font-size: 15.5px;
      max-width: 640px;
    }
    .hero-ctas {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .hero-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .hero-kpi {
      background: rgba(19, 29, 53, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    .hero-kpi-v { font-size: 15px; font-weight: 900; }
    .hero-kpi-s { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .phone-mockup-wrap {
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, #10192e 0%, #0a101f 100%);
      border: 2px solid #33466f;
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
    }
    .phone-notch {
      width: 96px;
      height: 5px;
      background: #2b3c61;
      border-radius: 99px;
      margin: 0 auto 14px;
    }
    .phone-stat-card {
      background: linear-gradient(135deg, #172442, #111b33);
      border: 1px solid rgba(249, 115, 22, 0.35);
      border-radius: 16px;
      padding: 14px;
    }
    .phone-mini-tile {
      background: #0d1527;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .pub-section {
      padding: 54px 0;
    }
    .pub-section.alt-bg {
      background: #0a101d;
      border-top: 1px solid rgba(37, 52, 86, 0.6);
      border-bottom: 1px solid rgba(37, 52, 86, 0.6);
    }
    .section-head {
      margin-bottom: 24px;
      max-width: 760px;
    }
    .section-head h2 {
      margin: 0 0 6px;
      font-size: clamp(22px, 2.8vw, 30px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
    }

    .exp-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .exp-tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .exp-tab.active {
      background: var(--orange-soft);
      border-color: var(--orange);
      color: #fdba74;
    }
    .exp-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .catalog-item {
      text-align: left;
      background: #0b1222;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.14s ease;
    }
    .catalog-item:hover {
      border-color: var(--orange);
      transform: translateY(-2px);
    }
    .receipt-paper {
      background: #f8fafc;
      color: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .sync-pipeline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }
    .sync-step {
      background: #0a101f;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      opacity: 0.65;
      transition: all 0.2s ease;
    }
    .sync-step.active {
      opacity: 1;
      border-color: rgba(16, 185, 129, 0.55);
      background: rgba(16, 185, 129, 0.08);
    }

    .dl-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      align-items: start;
    }
    .install-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--orange-soft);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fdba74;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 11px;
      flex-shrink: 0;
    }
    .qr-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .qr-frame {
      background: #ffffff;
      border-radius: 18px;
      padding: 10px;
      display: grid;
      place-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      border: 3px solid var(--orange);
    }

    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 14px;
    }
    .doc-bullets {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 7px;
      color: #cbd5e1;
      font-size: 13px;
    }
    .pub-footer {
      border-top: 1px solid var(--border);
      padding: 26px 0;
      color: var(--muted);
      font-size: 12.5px;
      background: #060911;
    }

    /* Admin Console Layout */
    .app-shell {
      display: grid;
      grid-template-columns: 268px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: linear-gradient(180deg, #0b1120 0%, #090e1a 100%);
      border-right: 1px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .nav-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--ink); }
    .nav-btn.active {
      background: var(--orange-soft);
      border-color: rgba(249, 115, 22, 0.45);
      color: #fdba74;
      font-weight: 700;
    }
    .nav-pill {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
    }
    .nav-btn.active .nav-pill { background: var(--orange); color: #fff; }
    .main-area { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .content { padding: 20px 22px 48px; max-width: 1460px; width: 100%; margin: 0 auto; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi-card {
      background: linear-gradient(180deg, var(--card) 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .kpi-value { font-size: 24px; font-weight: 900; margin-top: 4px; }
    .kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(37, 52, 86, 0.7); vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #0e1629; font-weight: 800; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(7px);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .modal-card {
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 90;
      background: #111c33;
      border: 1px solid var(--orange);
      color: var(--ink);
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-width: 420px;
    }
    .mobile-nav { display: none; }

    @media (max-width: 960px) {
      .hero-grid, .exp-grid, .dl-grid { grid-template-columns: 1fr; }
      .hero-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pub-links { display: none; }
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-nav {
        display: flex;
        overflow-x: auto;
        gap: 6px;
        padding: 10px 14px;
        background: #0b1120;
        border-bottom: 1px solid var(--border);
      }
      .mobile-nav .nav-btn { width: auto; flex-shrink: 0; padding: 7px 11px; }
    }
    @media (max-width: 600px) {
      .docs-grid { grid-template-columns: 1fr; }
      .pub-hide-xs { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./qr.js"></script>
  <script src="./i18n.js"></script>
  <script type="text/babel" src="./admin-console.js"></script>
  <script type="text/babel" src="./public-view.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const DEFAULT_RELEASE_INFO = {
      appName: 'BeBoss POS',
      packageId: 'com.aistudio.beboss.shopmgmt',
      versionName: '2.0.0',
      versionCode: 2,
      apkFileName: 'BeBoss-POS-v2.0.0.apk',
      apkRelativeUrl: './BeBoss-POS-v2.0.0.apk',
      sizeBytes: 37308779,
      sizeDisplay: '35.6 MB',
      minAndroid: 'Android 7.0+',
      sha256: 'c573f2c25a68330b02bf31f1e7a563f33e91b93055c2e531'
    };

    function BeBossRootApp() {
      const {
        MASTER_ADMIN_EMAIL,
        STORAGE_KEY,
        SCHEMA_SQL,
        loadInitialSession,
        fetchPublicPayConfig
      } = window.BeBossCore;

      const [session, setSession] = useState(loadInitialSession);
      const [lang, setLang] = useState(() => {
        try {
          const saved = localStorage.getItem('beboss_public_lang');
          if (saved && ['en', 'rw', 'fr', 'sw'].includes(saved)) return saved;
        } catch (_) {}
        return 'en';
      });
      const [mode, setMode] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get('admin') === '1' ? 'admin' : 'public';
      });
      const [showLoginModal, setShowLoginModal] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const init = loadInitialSession();
        const authed = Boolean(init.accessToken && init.url && init.anonKey && init.email === MASTER_ADMIN_EMAIL);
        return params.get('admin') === '1' && !authed;
      });
      const [showSqlModal, setShowSqlModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [releaseInfo, setReleaseInfo] = useState(DEFAULT_RELEASE_INFO);
      const [payConfig, setPayConfig] = useState({
        id: 'global',
        admin_whatsapp_number: '',
        mtn_momo_code: '054321',
        mtn_momo_phone: '0788765432',
        mtn_recipient_name: 'BeBoss Pay',
        airtel_money_phone: '0738765432',
        airtel_recipient_name: 'BeBoss Pay',
        per_device_fee_rwf: 2000,
        apk_download_url: '',
        apk_version: '2.0.0'
      });

      const isAdminAuthenticated = Boolean(
        session.accessToken && session.url && session.anonKey && session.email === MASTER_ADMIN_EMAIL
      );

      const notify = useCallback((msg) => setToastMsg(msg), []);

      useEffect(() => {
        if (!toastMsg) return;
        const t = setTimeout(() => setToastMsg(''), 3800);
        return () => clearTimeout(t);
      }, [toastMsg]);

      const handleChangeLang = useCallback((nextLang) => {
        setLang(nextLang);
        try {
          localStorage.setItem('beboss_public_lang', nextLang);
        } catch (_) {}
      }, []);

      const persistSession = useCallback((nextSession) => {
        setSession(nextSession);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextSession));
        } catch (_) {}
      }, [STORAGE_KEY]);

      const signOut = useCallback(async (silent = false) => {
        try {
          if (session.accessToken && session.url) {
            await fetch(`${session.url}/auth/v1/logout`, {
              method: 'POST',
              headers: { apikey: session.anonKey, Authorization: `Bearer ${session.accessToken}` }
            });
          }
        } catch (_) {}
        persistSession({
          ...session,
          accessToken: '',
          refreshToken: '',
          expiresAt: 0
        });
        setMode('public');
        if (!silent) notify('Signed out cleanly.');
      }, [session, persistSession, notify]);

      useEffect(() => {
        fetch('./release-info.json')
          .then(r => (r.ok ? r.json() : null))
          .then(data => {
            if (data && data.apkFileName) setReleaseInfo(prev => ({ ...prev, ...data }));
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        if (!session.url || !session.anonKey) return;
        fetchPublicPayConfig(session.url, session.anonKey).then(cfg => {
          if (cfg) setPayConfig(prev => ({ ...prev, ...cfg }));
        });
      }, [session.url, session.anonKey]);

      const handleOpenAdmin = () => {
        if (isAdminAuthenticated) {
          setMode('admin');
        } else {
          setShowLoginModal(true);
        }
      };

      const AdminConsole = window.BeBossAdminConsole;
      const PublicApp = window.BeBossPublicApp;
      const AdminLoginModal = window.BeBossAdminLoginModal;

      return (
        <>
          {mode === 'admin' && isAdminAuthenticated ? (
            <AdminConsole
              session={session}
              persistSession={persistSession}
              signOut={signOut}
              payConfig={payConfig}
              setPayConfig={setPayConfig}
              onBackToPublic={() => setMode('public')}
              notify={notify}
              onShowSql={() => setShowSqlModal(true)}
            />
          ) : (
            <PublicApp
              lang={lang}
              setLang={handleChangeLang}
              payConfig={payConfig}
              releaseInfo={releaseInfo}
              isAdminAuthenticated={isAdminAuthenticated}
              onOpenAdminLogin={() => setShowLoginModal(true)}
              onOpenAdminConsole={() => setMode('admin')}
              notify={notify}
            />
          )}

          {showLoginModal && (
            <AdminLoginModal
              session={session}
              onClose={() => setShowLoginModal(false)}
              onShowSql={() => setShowSqlModal(true)}
              onLoginSuccess={(nextSession) => {
                persistSession(nextSession);
                setShowLoginModal(false);
                setMode('admin');
                notify('Authenticated as BeBoss Master Admin.');
              }}
            />
          )}

          {showSqlModal && (
            <div className="modal-backdrop" onClick={() => setShowSqlModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <h3 style={{ margin: 0 }}>BeBoss Supabase SQL Schema</h3>
                  <button type="button" className="btn btn-dark btn-sm" onClick={() => setShowSqlModal(false)}>Close</button>
                </div>
                <textarea className="textarea mono" rows={16} readOnly value={SCHEMA_SQL} style={{ fontSize: 11.5 }} />
                <div style={{ marginTop: 12, display: 'flex', justifyContent: 'flex-end' }}>
                  <button
                    type="button"
                    className="btn btn-primary"
                    onClick={() => {
                      navigator.clipboard.writeText(SCHEMA_SQL);
                      notify('SQL copied!');
                    }}
                  >
                    Copy Schema SQL
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMsg && <div className="toast">{toastMsg}</div>}
        </>
      );
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BeBossRootApp />);
  </script>
</body>
</html>
